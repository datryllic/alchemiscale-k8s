# Job template for the compute service Jobs created by the alchemiscale-k8s
# compute manager; see the job specification section of pkg/README.md.
# Deployed in a ConfigMap together with manager-settings.yaml:
# `bash compute/manager-configmap.sh`.
#
# The compute service settings come from the same
# `alchemiscale-compute-settings-yaml` Secret that the manager itself mounts
# (see secrets.sh). The manager appends `--name` and `--compute-manager-id`
# to the first container's args.
apiVersion: batch/v1
kind: Job
spec:
  template:
    spec:
      containers:
      - name: alchemiscale-synchronous-container
        # placeholder: set to the alchemiscale version you deploy (see README.md)
        image: ghcr.io/openfreeenergy/alchemiscale-compute:vX.Y.Z
        args: ["compute", "synchronous", "-c", "/mnt/settings/synchronous-compute-settings.yaml"]
        resources:
          limits:
            cpu: 2
            memory: 12Gi
            ephemeral-storage: 48Gi
            nvidia.com/gpu: 1
          requests:
            cpu: 2
            memory: 12Gi
            ephemeral-storage: 48Gi
        volumeMounts:
          - name: alchemiscale-compute-settings-yaml
            mountPath: "/mnt/settings"
            readOnly: true
        env:
          # keep in step with the container CPU limit to avoid CFS throttling
          - name: OPENMM_CPU_THREADS
            value: "2"
      volumes:
        - name: alchemiscale-compute-settings-yaml
          secret:
            secretName: alchemiscale-compute-settings-yaml
